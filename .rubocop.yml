plugins:
  - rubocop-rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - 'db/**/*'
    - 'log/**/*'
    - 'tmp/**/*'
    - 'node_modules/**/*'
    - 'bin/*'
    - 'app/definitions/**/*'
    - 'spec/support/expectations/*'
    - 'app/services/etl/**/*'
    - 'app/dashboards/*'
    - 'config/routes.rb'
    - 'vendor/**/*' # For CircleCI.
  SuggestExtensions: false

Style/Documentation:
  # Skips checking to make sure top level modules / classes have a comment.
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/ClassAndModuleChildren:
  # Use compact module style for consistency and better indentation.
  EnforcedStyle: compact
  Exclude:
    # Faker.prepend Faker::EsrApi needs the parent module to be defined first,
    # so the nested style is required here.
    - 'config/initializers/faker.rb'

Style/MixinUsage:
  Enabled: false

Layout/LineLength:
  Max: 150

Metrics/BlockLength:
  Exclude:
    - 'Rakefile'
    - '**/*.rake'
    - 'spec/**/*.rb'

Rails/SkipsModelValidations:
  AllowedMethods:
    - update_all

# `activated` is paired with `activated=` (used as a virtual attribute) and
# the verify_* methods are existing public API. Renaming them is out of scope
# for a dependency update.
Naming/PredicateMethod:
  Enabled: false
